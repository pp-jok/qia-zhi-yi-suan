    canonical_fact_family: deterministic_facts.bazi.ten_gods
    semantic_claim: Output-star terminology is methodologically embedded in wider structural analysis and does not, in the reviewed corpus, state that an isolated Ten-God instance establishes the start or advancement of concrete action.
    target_primitive_id: P004
    target_primitive_question: When and how is concrete action started and advanced?
    p004_relevance: NOT_P004
