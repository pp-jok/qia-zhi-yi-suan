    scope: methodology-bound structural interpretation
    contexts: []
    conditions: [Requires full structural reading beyond a single Ten-God instance.]
    counter_conditions: [Output, expression, wealth, achievement, and generic activity are nearby constructs rather than P004 by themselves.]
    exclusions: [Popular Ten-God personality shorthand, legacy 食伤 plus 财 shortcut, direct state assertion]
    support_class: INDIRECT_NEARBY_CONSTRUCT
    limitations: Neither source supplies a directly locatable P004 action-initiation rule; current canonical facts do not encode a complete traditional structural judgement.
    review_status: accepted_for_review
  - claim_id: SKC-AS-MARS-ACTION-INITIATIVE-P004-V1
    system: astrology
    citations:
      - source_ref: SK-AS-MARS-HOULDING-2004
        locator: Paragraphs beginning "In astrology Mars represents the compelling force of action and initiative" and "The dignities and aspects reveal the details"
        support_role: primary
      - source_ref: SK-PROJECT-P004-ONTOLOGY-V2
        locator: P004 definition, excluded impulsivity, and action non-evidence semantics
        support_role: contextual
    related_claims: []
    tradition_or_school: traditional western astrology / horary-informed symbolic interpretation
    canonical_fact_family: deterministic_facts.astrology.placements
    semantic_claim: This traditional source explicitly associates Mars with action and initiative, while requiring dignity and aspects to determine particulars; it is a methodology claim, not an empirically established personality fact.
    target_primitive_id: P004
    target_primitive_question: When and how is concrete action started and advanced?
    p004_relevance: DIRECT_ACTION_INITIATION
    direction_relevance: conditional_supported_high
    scope: symbolic natal indication requiring whole-chart qualification
    contexts: [action, pressure]
    conditions: [A Mars placement must be assessed with dignity and aspect conditions under a declared traditional school.]
    counter_conditions: [The source itself links Mars to conflict, assertion, survival response, and danger; these are not equivalent to readily initiating and advancing concrete action.]
    exclusions: [Mars equals energy shortcut, Mars equals impulsivity shortcut, aspect-only direction, global state assertion]
    support_class: DIRECT_BUT_SCHOOL_SPECIFIC
    limitations: Some traditional qualifiers are not represented, but their necessity for P004 is methodology-dependent; no approved natal method or complete fact-to-P004 direction currently exists.
    review_status: accepted_for_review
