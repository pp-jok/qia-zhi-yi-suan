    direction: practical
    interpretation: 财星信号聚焦可调度的资源、实际成果与投入回报。
    mechanism: 通过对外部资源的识别与安排，将意图落到可交付的层面。
    likely_expression: 在工作或生活安排中，可能关注时间、成本和结果是否可控。
    contexts: [工作, 日常管理]
    modifiers: [需结合正偏与位置]
    confidence: moderate
    limitations: [不代表实际财富或理财能力。]

  - signal_id: BAZI-TEN-GOD-AUTHORITY
    family: bazi.ten_god.identity
    system: bazi
    fact_refs: [bazi.ten_god.day_master_relation]
    value_predicates:
      - fact_ref: bazi.ten_god.day_master_relation
        values: [正官, 七杀]
        positions: [year, month, day, hour]
        source_kinds: [visible_stem, hidden_stem, unknown]
        minimum_occurrences: 1
    traditional_rule_ref: "子平法十神法；《渊海子平》"
    topic: structure and pressure
    direction: structured
    interpretation: 官杀信号指向规范、约束、责任与压力的处理方式。
    mechanism: 外部要求被内化为行动边界，促使个体在规则与挑战中调整。
    likely_expression: 面对任务时可能更先确认责任、标准和风险边界。
    contexts: [责任, 压力情境]
    modifiers: [需区分稳定规范与急迫压力]
    confidence: moderate
    limitations: [不能由此推定职位、权力或事件吉凶。]

  - signal_id: BAZI-TEN-GOD-REPETITION
    family: bazi.ten_god.repetition
    system: bazi
    fact_refs: [bazi.ten_god.day_master_relation]
    value_predicates:
      - fact_ref: bazi.ten_god.day_master_relation
        values: [比肩, 劫财, 食神, 伤官, 正财, 偏财, 正官, 七杀, 正印, 偏印]
        positions: [year, month, day, hour]
        source_kinds: [visible_stem, hidden_stem, unknown]
        minimum_occurrences: 2
    traditional_rule_ref: "子平法十神复见观察法；《三命通会》"
    topic: recurring emphasis
    direction: reinforced
    interpretation: 同类十神信号多次出现时，相关议题可能在不同情境中反复被触发。
    mechanism: 重复来源提高了某类关系在全局中的可见度，但不等于线性增强。
    likely_expression: 相同主题可能在学习、工作或关系中以不同形式重现。
    contexts: [跨情境观察]
    modifiers: [重复数量仅是关注标记]
    confidence: exploratory
    limitations: [需辨别每个实例的柱位和来源，不做强弱判定。]

  - signal_id: BAZI-RELATION-DYNAMICS
    family: bazi.branch_relation
    system: bazi
    fact_refs: [bazi.branch_relation]
    value_predicates:
      - fact_ref: bazi.branch_relation
        values: [combination, clash, harm, punishment, five_element_controls]
        positions: [year, month, day, hour]
        participants: [year.branch, month.branch, day.branch, hour.branch]
        minimum_occurrences: 1
    traditional_rule_ref: "子平法地支关系法；《三命通会》"
    topic: contextual dynamics
    direction: relational
    interpretation: 地支关系信号用来标记不同生活领域之间的联动、拉扯或制约。
    mechanism: 关系类型连接了具体参与柱位，提供情境间如何互相影响的观察线索。
    likely_expression: 在多重角色同时被激活时，可能感到协同或冲突需要被协调。
    contexts: [家庭, 工作, 关系]
    modifiers: [必须保留关系类型与参与柱位]
    confidence: exploratory
    limitations: [关系事实必须结合全局，不构成事件预测。]

  - signal_id: ASTROLOGY-PLANET-SIGN-EXPRESSION
    family: astrology.planet_sign_quality
    system: astrology
    fact_refs: [astrology.sign_element, astrology.sign_modality]
    value_predicates:
      - {fact_ref: astrology.sign_element, body: Sun, values: [fire, earth, air, water]}
      - {fact_ref: astrology.sign_modality, body: Sun, values: [cardinal, fixed, mutable]}
    traditional_rule_ref: "现代西方占星学行星星座综合法；Stephen Arroyo"
    topic: style of expression
    direction: outward
    interpretation: 太阳所在星座的元素与模式，提供核心意志如何定义和表达自我的象征语言。
    mechanism: 核心意志借由实际命中的元素取向选择表达材料，并按命中模式调整推进节奏。
    likely_expression: 在需要表态或承担核心角色时，可能按实际命中的元素与模式展现不同的强调方式。
    contexts: [自我表达, 启动任务]
    modifiers: [需结合宫位、相位与尊贵]
    confidence: moderate
    limitations: [行星星座象征不是人格测量。]

