bundle_version: audited-interpretive-rules-v2
predicate_version: audited-interpretive-value-predicates-v2
limitations:
  - 这些内容是传统象征解读，不是经验科学的人格诊断。
  - 任何单一信号都不能独立确定人格、健康或人生结果。
rules:
  - signal_id: BAZI-TEN-GOD-EXPRESSION
    family: bazi.ten_god.identity
    system: bazi
    fact_refs: [bazi.ten_god.day_master_relation]
    value_predicates:
      - fact_ref: bazi.ten_god.day_master_relation
        values: [正印, 偏印]
        positions: [year, month, day, hour]
        source_kinds: [visible_stem, hidden_stem, unknown]
        minimum_occurrences: 1
    traditional_rule_ref: "子平法十神法；《渊海子平》"
    topic: style of expression
    direction: reflective
    interpretation: 印星信号将注意力引向理解、吸收与内在整理。
    mechanism: 通过接收信息、建立解释框架后再表达，因而形成偏反思的表达节奏。
    likely_expression: 在学习或沟通中，可能先听、先理解，再给出经过组织的回应。
    contexts: [学习, 沟通]
    modifiers: [需结合所在柱位与显藏来源]
    confidence: moderate
    limitations: [需与全局其他十神与关系合看。]

  - signal_id: BAZI-TEN-GOD-PEER
    family: bazi.ten_god.identity
    system: bazi
    fact_refs: [bazi.ten_god.day_master_relation]
    value_predicates:
      - fact_ref: bazi.ten_god.day_master_relation
        values: [比肩, 劫财]
        positions: [year, month, day, hour]
        source_kinds: [visible_stem, hidden_stem, unknown]
        minimum_occurrences: 1
    traditional_rule_ref: "子平法十神法；《渊海子平》"
    topic: agency
    direction: self-directed
    interpretation: 比劫信号强调自我立场、同辈互动与资源边界。
    mechanism: 通过相同或相近力量的并置，使自主与竞合成为显著议题。
    likely_expression: 在协作中可能更在意对等、自主权与责任分配。
    contexts: [协作, 资源分配]
    modifiers: [比肩与劫财的具体差异需单独辨识]
    confidence: moderate
    limitations: [不能由此推定一个人自私或好竞争。]

  - signal_id: BAZI-TEN-GOD-OUTPUT
    family: bazi.ten_god.identity
    system: bazi
    fact_refs: [bazi.ten_god.day_master_relation]
    value_predicates:
      - fact_ref: bazi.ten_god.day_master_relation
        values: [食神, 伤官]
        positions: [year, month, day, hour]
        source_kinds: [visible_stem, hidden_stem, unknown]
        minimum_occurrences: 1
    traditional_rule_ref: "子平法十神法；《渊海子平》"
    topic: creative output
    direction: expressive
    interpretation: 食伤信号将重点放在输出、表达与对既有规则的个人化处理。
    mechanism: 内在资源向外转化，使创作、说明或改造成为主要通道。
    likely_expression: 可能通过作品、语言或方法改进来表达自己的理解。
    contexts: [创作, 公开表达]
    modifiers: [需区分温和输出与批判性输出]
    confidence: moderate
    limitations: [不等同于才华水平或职业成就。]

  - signal_id: BAZI-TEN-GOD-WEALTH
    family: bazi.ten_god.identity
    system: bazi
